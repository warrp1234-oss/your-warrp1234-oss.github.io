<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>SCPD Records Database – Access</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#8a8a8a;font:13px "Trebuchet MS",Verdana,sans-serif}
.bezel{max-width:860px;margin:18px auto;background:linear-gradient(#1d1d1d,#050505);border-radius:14px 14px 6px 6px;padding:30px 26px 14px;position:relative;box-shadow:0 6px 18px #0008}
.leds{position:absolute;top:10px;left:30px;display:flex;gap:5px}.leds i{width:9px;height:9px;background:#7a1010}.leds i:last-child{background:#0a7a2a}
.screen{background:#02063d;color:#fff;min-height:520px;border:2px solid #000;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:16px;padding:14px 22px}
.badge{width:52px;height:62px;position:relative;flex:none;background:none}.badge img{width:100%;height:100%;object-fit:contain}
.ttl b{font:900 46px/1 Impact,"Arial Black",sans-serif;color:#f0b81e;letter-spacing:2px}
.stripe{height:10px;background:repeating-linear-gradient(-60deg,#f0b81e 0 10px,#02063d 10px 16px);margin:3px 0}
.ttl span{font-weight:bold;letter-spacing:1px;font-size:17px}
.gold{border-top:3px solid #f0b81e}
.body{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px}
.disp{width:min(420px,100%);border:3px solid #f0b81e;background:#02063d;height:58px;display:flex;align-items:center;justify-content:center;font-size:30px;letter-spacing:.5em;padding-left:.5em;color:#fff}
.msg{height:24px;margin:10px 0;letter-spacing:2px;font-weight:bold;color:#f0b81e}.msg.bad{color:#ff5a5a}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.k{background:linear-gradient(#f3a313,#e08a00);color:#fff;border:0;border-radius:8px;height:56px;font:bold 20px "Trebuchet MS",Verdana;text-shadow:1px 1px 0 #000;cursor:pointer}
.k.s{font-size:13px}.k:hover,.k:focus-visible{background:#ffc04a;outline:2px solid #fff}
.k.en{background:linear-gradient(#4fa3cc,#3689b3)}
.ft{display:flex;justify-content:space-between;padding:12px 24px;border-top:3px solid #f0b81e;font-size:12px;letter-spacing:1px}
.ft a{color:#fff}
.keys{display:flex;gap:18px;padding:22px 40px 8px}.keys i{width:44px;height:14px;background:linear-gradient(#bbb,#666);border-radius:2px}
.vents{height:22px;margin:6px 60px 0;background:repeating-linear-gradient(90deg,#333 0 6px,#000 6px 12px)}
</style></head><body>
<div class="bezel"><div class="leds"><i></i><i></i><i></i></div>
<div class="screen">
  <div class="hd"><div class="badge" id="badge"></div><div class="ttl"><b>SCPD</b><div class="stripe"></div><span>RECORDS DATABASE</span></div></div>
  <div class="gold"></div>
  <div class="body">
    <div class="msg" id="msg">ENTER ACCESS CODE</div>
    <div class="disp" id="disp">&nbsp;</div>
    <div style="height:18px"></div>
    <div class="pad" id="pad"></div>
  </div>
  <div class="ft"><span>CONFIDENTIAL – FOR OFFICIAL USE ONLY</span><a href="index.html">&larr; BACK TO WEBSITE</a></div>
</div>
<div class="keys"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="vents"></div></div>
<script>
/* ---------- SETTINGS ---------- */
const DB_URL="db-gqw5ootvrsfmu7.html";   // the real database page (keep this filename private)
const BADGE="images/SCPD.png";            // "" for blank
/* SHA-256 of "scpd2008:" + code. To change the code, see instructions in chat. */
const HASH="65e55182d96e4c811de1b532ed9496625aa0b7081ee82d4b778476c7090be6a7";
/* ------------------------------ */
const $=id=>document.getElementById(id);
let code="",fails=0,locked=false;
if(BADGE)$("badge").innerHTML=`<img src="${BADGE}" alt="" onerror="this.remove()">`;
$("pad").innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="k" onclick="press('${n}')">${n}</button>`).join("")+
 `<button class="k s" onclick="del()">DELETE</button><button class="k" onclick="press('0')">0</button><button class="k s en" onclick="enter()">ENTER</button>`;
function draw(){$("disp").textContent=code?"\u25CF".repeat(code.length):"\u00A0"}
function say(t,bad){$("msg").textContent=t;$("msg").className="msg"+(bad?" bad":"")}
function press(d){if(!locked&&code.length<8){code+=d;draw()}}
function del(){code=code.slice(0,-1);draw()}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function enter(){
  if(locked||!code)return;
  if(!window.crypto||!crypto.subtle){say("OPEN OVER HTTPS TO LOG IN",true);return}
  if(await sha("scpd2008:"+code)===HASH){sessionStorage.setItem("scpdAuth",Date.now());say("ACCESS GRANTED");location.href=DB_URL}
  else{code="";draw();fails++;say("ACCESS DENIED",true);
    if(fails>=3){locked=true;let s=30;const t=setInterval(()=>{say("LOCKED – WAIT "+s+"s",true);if(--s<0){clearInterval(t);locked=false;fails=0;say("ENTER ACCESS CODE")}},1000)}}
}
document.addEventListener("keydown",e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")del();else if(e.key==="Enter")enter()});
</script></body></html>
